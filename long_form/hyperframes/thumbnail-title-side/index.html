<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Episode Title"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family: "Inter", sans-serif;
        background: transparent;
      }
      .title-card {
        position: absolute;
        left: 64px;
        top: 536px;
        width: 640px;
        height: 520px;
        padding: 44px 56px;
        border: 3px solid transparent;
        border-radius: 36px;
        background:
          linear-gradient(155deg, rgba(52, 0, 141, 0.92), rgba(26, 31, 54, 0.97) 46%, rgba(0, 96, 255, 0.4)),
          #1a1f36;
        overflow: hidden;
        opacity: 0;
        transform: translateY(60px) scale(0.96);
        box-shadow:
          0 24px 48px rgba(0, 0, 0, 0.4),
          0 0 32px rgba(169, 96, 255, 0.4),
          inset 0 0 32px rgba(0, 202, 255, 0.14);
      }
      .title-card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 7px),
          linear-gradient(105deg, transparent 0 42%, rgba(0, 202, 255, 0.2) 48%, rgba(255, 0, 128, 0.18) 52%, transparent 58%);
        mix-blend-mode: screen;
        opacity: 0.5;
      }
      .title-card::after {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(0, 202, 255, 0.42);
        border-radius: 26px;
        pointer-events: none;
        box-shadow: inset 0 0 18px rgba(252, 0, 239, 0.16);
      }
      .title-card__edge {
        position: absolute;
        inset: 0;
        border: 3px solid transparent;
        border-radius: 36px;
        background: linear-gradient(110deg, #a960ff 0%, #00caff 28%, #fc00ef 52%, #8000ff 76%, #a960ff 100%) border-box;
        background-size: 240% 100%;
        -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        z-index: 4;
      }
      .title-card__rule {
        position: absolute;
        left: 56px;
        right: 56px;
        top: 44px;
        height: 3px;
        background: linear-gradient(90deg, #34008d 0%, #a960ff 45%, #00caff 100%);
        transform-origin: 0 50%;
      }
      .title-card__text {
        position: relative;
        z-index: 5;
        margin-top: 32px;
        color: #fff;
        font-size: 58px;
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -1px;
        text-align: left;
        white-space: normal;
        word-wrap: break-word;
        text-shadow: 0 0 20px rgba(0, 202, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="title-card"
        class="clip title-card"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      >
        <div class="title-card__edge"></div>
        <div class="title-card__rule"></div>
        <div class="title-card__text" data-var-text="title">Episode Title</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#title-card", {
        opacity: 1,
        y: 0,
        scale: 1,
        duration: 0.85,
        ease: "power3.out",
      }, 0.15);
      tl.to(".title-card__edge", {
        backgroundPosition: "100% 50%",
        duration: 2.8,
        ease: "sine.inOut",
      }, 1.0);
      tl.fromTo(".title-card__rule", { scaleX: 0 }, {
        scaleX: 1,
        duration: 0.8,
        ease: "power2.out",
      }, 0.45);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
